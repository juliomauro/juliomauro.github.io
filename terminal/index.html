<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERM — oruam.cloud</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000300'/><text x='4' y='23' font-size='20' fill='%2300ff41' font-family='monospace'>$</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --mon-w: 1100px; }
html { height: 100%; background: #050505; }
body {
  height: 100%;
  background: #050505;
  color: #00dd33;
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Matrix canvas — full viewport, visible in the "room" outside the monitor */
#matrix-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0; opacity: 0.025; pointer-events: none;
}

/* ── MONITOR OUTER WRAPPER ── */
#monitor-outer {
  position: relative;
  z-index: 10;
  /* fill the viewport — monitor scales from ~320px to 1440px */
  width: min(94vw, 1440px, calc((100vh - 110px) * 1.778));
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── BEZEL ── */
#monitor-bezel {
  width: 100%;
  /* Convex plastic surface: radial bloom at center-top + darker toward edges */
  background:
    radial-gradient(ellipse 85% 55% at 50% 12%, rgba(255,255,255,0.045) 0%, transparent 70%),
    linear-gradient(180deg,
      #2e2e2e 0%,
      #252525 12%,
      #1d1d1d 55%,
      #171717 82%,
      #111 100%
    );
  border-radius: clamp(10px, calc(var(--mon-w) * 0.02), 24px)
                 clamp(10px, calc(var(--mon-w) * 0.02), 24px)
                 clamp(4px,  calc(var(--mon-w) * 0.009), 11px)
                 clamp(4px,  calc(var(--mon-w) * 0.009), 11px);
  padding: clamp(14px, calc(var(--mon-w) * 0.027), 34px)
           clamp(14px, calc(var(--mon-w) * 0.029), 34px)
           clamp(28px, calc(var(--mon-w) * 0.054), 64px);
  position: relative;
  box-shadow:
    /* Outer edge bevel — top/left catch ambient light */
    inset 0 2px 0 rgba(255,255,255,0.10),
    inset 0 1px 0 rgba(255,255,255,0.06),
    inset 2px 0 0 rgba(255,255,255,0.04),
    /* Outer edge bevel — bottom/right in shadow */
    inset 0 -2px 0 rgba(0,0,0,0.85),
    inset -2px 0 0 rgba(0,0,0,0.55),
    /* Hard outer lip */
    0 0 0 1px #3d3d3d,
    0 0 0 2px #080808,
    /* Drop shadows */
    0 4px 10px rgba(0,0,0,0.55),
    0 18px 48px rgba(0,0,0,0.88),
    0 50px 100px rgba(0,0,0,0.95),
    /* Ambient phosphor glow from the screen */
    0 0 120px rgba(0,255,65,0.07);
}

/* ── SCREEN RECESS — the slope/wall between bezel face and screen ── */
#screen-recess {
  border-radius: clamp(12px, calc(var(--mon-w) * 0.024), 28px);
  padding: clamp(6px, calc(var(--mon-w) * 0.013), 15px);
  position: relative;
  /* The slope face catches a tiny bit of light at its outer edge,
     then plunges into darkness toward the screen */
  background:
    linear-gradient(135deg, #202020 0%, #0c0c0c 25%, #060606 100%);
  box-shadow:
    /* Top wall — darkest, farthest from screen */
    inset 0 8px 28px rgba(0,0,0,1),
    inset 0 3px 10px rgba(0,0,0,0.95),
    /* Left wall */
    inset 8px 0 20px rgba(0,0,0,0.92),
    /* Bottom wall — slightly lighter, ambient bounce */
    inset 0 -4px 12px rgba(0,0,0,0.55),
    /* Right wall */
    inset -4px 0 14px rgba(0,0,0,0.65),
    /* Top-left slope face highlight (the angled plastic surface) */
    inset 0 1px 0 rgba(90,90,90,0.35),
    inset 1px 0 0 rgba(90,90,90,0.18);
}


/* ── SCREEN ── */
#monitor-screen {
  position: relative;
  background: #000300;
  /* 16:9 ratio — width drives height */
  width: 100%;
  aspect-ratio: 16 / 9;
  /* Pronounced rounding like a real CRT phosphor tube */
  border-radius: clamp(10px, calc(var(--mon-w) * 0.02), 24px);
  overflow: hidden;
  box-shadow:
    inset 0 0 60px rgba(0,0,0,0.8),
    0 0 30px rgba(0,255,65,0.25),
    0 0 70px rgba(0,255,65,0.08);
}

/* Convex glass reflection — top-left bloom like a CRT tube */
#monitor-screen::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 28% 22%,
      rgba(255,255,255,0.038) 0%,
      rgba(255,255,255,0.01) 45%,
      transparent 70%
    );
  pointer-events: none;
  z-index: 750;
  border-radius: inherit;
}

/* ── SCREEN OVERLAYS (all position:absolute inside #monitor-screen) ── */

/* Corner curvature darkening — larger radius for CRT tube look */
#screen-corners {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 700;
  background:
    radial-gradient(circle clamp(55px, calc(var(--mon-w) * 0.1), 120px) at 0% 0%,    rgba(0,0,0,0.96) 0%, transparent 100%),
    radial-gradient(circle clamp(55px, calc(var(--mon-w) * 0.1), 120px) at 100% 0%,  rgba(0,0,0,0.96) 0%, transparent 100%),
    radial-gradient(circle clamp(55px, calc(var(--mon-w) * 0.1), 120px) at 0% 100%,  rgba(0,0,0,0.96) 0%, transparent 100%),
    radial-gradient(circle clamp(55px, calc(var(--mon-w) * 0.1), 120px) at 100% 100%,rgba(0,0,0,0.96) 0%, transparent 100%);
}

/* Scanlines inside screen */
#screen-scanlines {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 690;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.13) 3px,
    rgba(0,0,0,0.13) 4px
  );
}

/* Screen edge vignette */
#screen-vignette {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 680;
  background: radial-gradient(ellipse at center,
    transparent 42%,
    rgba(0,0,0,0.35) 80%,
    rgba(0,0,0,0.65) 100%
  );
}

/* Phosphor flash on power-on */
#crt-flash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, #afffbe 0%, #00ff41 40%, #003300 100%);
  z-index: 660; opacity: 0;
  pointer-events: none;
}

/* Static noise container */
#crt-static {
  position: absolute; inset: 0;
  z-index: 650; display: none; opacity: 1;
  pointer-events: none;
}

/* ── CRT POWER-ON CURTAINS ── */
#crt-poweron {
  position: absolute; inset: 0; z-index: 600;
  display: flex; flex-direction: column;
  pointer-events: none;
}
#crt-top, #crt-bottom {
  background: #000300;
  height: 50%;
  transition: height 1.1s cubic-bezier(0.4, 0, 0.2, 1);
}
#crt-scanline {
  height: 5px; flex-shrink: 0;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(0,255,65,0.3) 15%,
    rgba(200,255,220,0.8) 40%,
    #ffffff 48%,
    #afffbe 50%,
    #ffffff 52%,
    rgba(200,255,220,0.8) 60%,
    rgba(0,255,65,0.3) 85%,
    transparent 100%
  );
  box-shadow:
    0 0 8px #00ff41,
    0 0 24px rgba(0,255,65,0.9),
    0 0 60px rgba(0,255,65,0.7),
    0 0 120px rgba(255,255,255,0.25);
  transition: opacity 0.5s ease-out;
}

/* ── BOOT ── */
#boot-screen {
  position: absolute; inset: 0; background: #000300; z-index: 500;
  display: flex; flex-direction: column; justify-content: center;
  padding: 10%;
}
#boot-screen.hidden { display: none; }
#boot-screen { font-size: clamp(13px, calc(var(--mon-w) * 0.019), 23px); }
.boot-line { font-size: 0.86em; letter-spacing: 1px; color: #00aa22; margin-bottom: 5px; opacity: 0; }
.boot-line.show { animation: bfade 0.15s forwards; }
.boot-ok   { color: #00ff41; text-shadow: 0 0 6px #00ff4188; }
.boot-warn { color: #ffaa00; }
@keyframes bfade { to { opacity: 1; } }

/* ── SHELL ── */
#terminal {
  position: relative; z-index: 10;
  display: flex; flex-direction: column;
  height: 100%;
  font-size: clamp(13px, calc(var(--mon-w) * 0.019), 23px);
  animation: phosphor-flicker 7s ease infinite, h-jitter 13s step-end infinite;
}

/* Subtle phosphor flicker */
@keyframes phosphor-flicker {
  0%,100% { opacity: 1; }
  20%     { opacity: 1; }
  21%     { opacity: 0.96; }
  22%     { opacity: 1; }
  75%     { opacity: 1; }
  76%     { opacity: 0.93; }
  77%     { opacity: 1; }
  94%     { opacity: 1; }
  95%     { opacity: 0.97; }
  96%     { opacity: 1; }
}

/* Occasional horizontal micro-jitter */
@keyframes h-jitter {
  0%,100% { transform: translateX(0); }
  49%     { transform: translateX(0); }
  50%     { transform: translateX(0.4px); }
  51%     { transform: translateX(0); }
  74%     { transform: translateX(0); }
  75%     { transform: translateX(-0.3px); }
  76%     { transform: translateX(0); }
}

#term-header {
  padding: clamp(5px, calc(var(--mon-w) * 0.008), 10px) clamp(12px, calc(var(--mon-w) * 0.025), 30px);
  border-bottom: 1px solid #003300;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.9em; letter-spacing: 2px; color: #007722;
  flex-shrink: 0;
}
#term-header .hl { color: #00ff41; text-shadow: 0 0 8px #00ff4166; }
#term-path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
#prompt-area {
  padding: clamp(5px, calc(var(--mon-w) * 0.009), 11px) clamp(12px, calc(var(--mon-w) * 0.025), 30px) 2px;
  font-size: 1em; color: #00aa22;
  flex-shrink: 0; line-height: 1.4;
}
#prompt-cmd { color: #00ff41; }
#cursor-blink {
  display: inline-block; width: 0.38em; height: 0.67em;
  background: #00ff41; vertical-align: middle;
  animation: cur 0.8s step-end infinite; margin-left: 1px;
  box-shadow: 0 0 6px #00ff41;
}
@keyframes cur { 50% { opacity: 0; } }
#content-area {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: clamp(3px, calc(var(--mon-w) * 0.005), 7px) clamp(12px, calc(var(--mon-w) * 0.025), 30px) clamp(10px, calc(var(--mon-w) * 0.018), 22px);
  scrollbar-width: thin; scrollbar-color: #004400 transparent;
}
#content-area::-webkit-scrollbar { width: 4px; }
#content-area::-webkit-scrollbar-thumb { background: #004400; border-radius: 2px; }
#status-bar {
  padding: clamp(4px, calc(var(--mon-w) * 0.006), 8px) clamp(12px, calc(var(--mon-w) * 0.025), 30px);
  border-top: 1px solid #003300;
  display: flex; gap: clamp(10px, calc(var(--mon-w) * 0.018), 22px); flex-wrap: wrap;
  font-size: 0.9em; color: #006622; letter-spacing: 1px;
  flex-shrink: 0;
}
.kbd { color: #00aa22; border: 1px solid #004400; padding: 1px 5px; font-size: 0.86em; font-family: 'Share Tech Mono', monospace; }

/* ── LISTING ── */
#listing { margin-top: 6px; }
.ls-row {
  display: flex; align-items: baseline;
  padding: clamp(3px, calc(var(--mon-w) * 0.004), 5px) clamp(3px, calc(var(--mon-w) * 0.005), 6px); font-size: 1em; letter-spacing: 1px;
  border-left: 2px solid transparent; cursor: pointer;
  user-select: none; transition: background 0.08s;
}
.ls-row.active { border-left-color: transparent; background: #00ff41; color: #000a00; }
.ls-row.active .ls-arrow { color: #000a00; }
.ls-row.active .ls-perms { color: #004400; }
.ls-row.active .ls-name  { color: #000a00; }
.ls-row.active .ls-desc  { color: #005500; }
.ls-arrow { width: 16px; color: #00ff41; flex-shrink: 0; font-size: 0.52em; }
.ls-perms { color: #004400; font-size: 0.9em; margin-right: 12px; }
.ls-name  { color: #00cc33; min-width: clamp(120px, calc(var(--mon-w) * 0.18), 210px); }
.ls-desc  { color: #006622; font-size: 0.95em; }

/* ── SECTION CONTENT ── */
#section-view { display: none; font-size: 1em; line-height: 1.55; overflow-wrap: break-word; word-break: break-word; max-width: 100%; }
.sv-head {
  color: #00ff41; font-size: 0.9em; letter-spacing: 3px; text-transform: uppercase;
  margin: 10px 0 12px; display: flex; align-items: center; gap: 14px;
}
.sv-head::after { content: ''; flex: 1; height: 1px; background: #003300; }
.sv-text  { color: #00bb33; margin-bottom: 2px; }
.sv-blank { height: 8px; }
.sv-skill-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0 40px; margin-top: 6px;
}
.sv-skill { color: #00bb33; padding: 4px 0; }
.sv-skill::before { content: '  > '; color: #005500; }
@media (max-width: 640px) { .sv-skill-grid { grid-template-columns: 1fr; } }
.sv-company { color: #00ff41; font-size: 1.05em; letter-spacing: 2px; margin: 14px 0 1px; }
.sv-meta    { color: #006622; font-size: 0.9em; letter-spacing: 1px; margin-bottom: 8px; }
.sv-role    { color: #00aa22; margin: 8px 0 3px; }
.sv-bullet  { color: #009922; padding-left: 14px; margin-bottom: 1px; }
.sv-bullet::before { content: '> '; color: #005500; }
.sv-divider { border: none; border-top: 1px solid #002200; margin: 14px 0; }
.sv-edu { color: #00bb33; margin-bottom: 6px; }
.sv-edu::before { content: '■ '; color: #00ff41; font-size: 0.57em; }
.sv-edu .school  { color: #00ff41; }
.sv-edu .period  { color: #006622; font-size: 0.62em; margin-left: 10px; }
.sv-cert { font-size: 0.95em; color: #00993a; margin-bottom: 4px; }
.sv-cert::before { content: '✓ '; color: #009933; }
.sv-cert .issuer { color: #006622; margin-left: 8px; font-size: 0.9em; }
.sv-proj { margin-bottom: 18px; }
.sv-proj-title {
  color: #00ff41; font-size: 0.71em; letter-spacing: 1px;
  margin-bottom: 2px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.sv-proj-num    { color: #005500; font-size: 0.86em; }
.sv-proj-status { font-size: 0.81em; letter-spacing: 2px; padding: 1px 6px; border: 1px solid; }
.status-wip     { color: #ffaa00; border-color: #554400; }
.status-active  { color: #00ff41; border-color: #005500; }
.status-done    { color: #00aa22; border-color: #004400; }
.status-growing { color: #00ccff; border-color: #004455; }
.sv-proj-meta   { color: #006622; font-size: 0.9em; letter-spacing: 1px; margin-bottom: 5px; }
.sv-proj-desc   { color: #009922; padding-left: 14px; font-size: 0.95em; max-width: min(680px, calc(var(--mon-w) * 0.62)); }
.sv-proj-desc::before { content: '> '; color: #005500; }
.sv-proj-url    { color: #0088aa; font-size: 0.9em; padding-left: 14px; margin-top: 3px; }
.sv-proj-url::before { content: '↗ '; }

/* ── EXPERIENCE LIST ── */
.exp-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: clamp(3px, calc(var(--mon-w) * 0.004), 5px) clamp(3px, calc(var(--mon-w) * 0.005), 6px); font-size: 1em;
  border-left: 2px solid transparent; cursor: pointer; user-select: none;
}
.exp-row.active { border-left-color: transparent; background: #00ff41; color: #000a00; }
.exp-arrow   { width: 16px; color: #00ff41; flex-shrink: 0; font-size: 0.62em; }
.exp-row.active .exp-arrow { color: #000a00; }
.exp-company { color: #00cc33; flex: 1; }
.exp-row.active .exp-company { color: #000a00; }
.exp-period  { color: #005500; font-size: 0.81em; flex-shrink: 0; }
.exp-row.active .exp-period  { color: #003300; }

/* ── WRITING LIST ── */
.wr-row {
  display: flex; align-items: baseline;
  padding: clamp(3px, calc(var(--mon-w) * 0.004), 5px) clamp(3px, calc(var(--mon-w) * 0.005), 6px); font-size: 1em;
  border-left: 2px solid transparent; cursor: pointer; user-select: none;
}
.wr-row.active { border-left-color: transparent; background: #00ff41; color: #000a00; }
.wr-arrow { width: 16px; color: #00ff41; flex-shrink: 0; font-size: 0.62em; }
.wr-row.active .wr-arrow { color: #000a00; }
.wr-tag   { color: #005500; font-size: 0.81em; min-width: clamp(80px, calc(var(--mon-w) * 0.12), 140px); flex-shrink: 0; }
.wr-row.active .wr-tag { color: #003300; }
.wr-title { color: #00cc33; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wr-row.active .wr-title { color: #000a00; }
.wr-level { color: #004400; font-size: 0.81em; margin-left: 14px; flex-shrink: 0; }
.wr-row.active .wr-level { color: #003a00; }

/* ── PROJECTS LIST ── */
.pr-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: clamp(3px, calc(var(--mon-w) * 0.004), 5px) clamp(3px, calc(var(--mon-w) * 0.005), 6px); font-size: 1em;
  border-left: 2px solid transparent; cursor: pointer; user-select: none;
}
.pr-row.active { border-left-color: transparent; background: #00ff41; color: #000a00; }
.pr-arrow  { width: 16px; color: #00ff41; flex-shrink: 0; font-size: 0.62em; }
.pr-row.active .pr-arrow { color: #000a00; }
.pr-num    { color: #005500; font-size: 0.81em; flex-shrink: 0; min-width: 50px; }
.pr-row.active .pr-num { color: #003300; }
.pr-title  { color: #00cc33; flex: 1; }
.pr-row.active .pr-title { color: #000a00; }
.pr-badge  { font-size: 0.71em; letter-spacing: 1px; padding: 0 5px; border: 1px solid; flex-shrink: 0; }
.pr-row.active .pr-badge { border-color: #005500; }
.pr-url    { color: #0088aa; font-size: 0.81em; padding: 2px 6px 2px 34px; }
.pr-row.active .pr-url { color: #003a00; }

/* ── ARTICLE CONTENT ── */
.art-h1  { color: #00ff41; font-size: 1.14em; letter-spacing: 2px; margin: 10px 0 6px; max-width: min(760px, calc(var(--mon-w) * 0.88)); }
.art-h2  { color: #00ee44; font-size: 1em; letter-spacing: 1px; margin: 16px 0 4px; padding-bottom: 3px; border-bottom: 1px solid #003300; max-width: min(760px, calc(var(--mon-w) * 0.88)); }
.art-h3  { color: #00cc33; font-size: 0.9em; margin: 12px 0 3px; max-width: min(760px, calc(var(--mon-w) * 0.88)); }
.art-p   { color: #00aa22; max-width: min(760px, calc(var(--mon-w) * 0.68)); margin-bottom: 6px; line-height: 1.5; }
.art-li  { color: #009922; padding-left: 20px; margin-bottom: 2px; max-width: min(760px, calc(var(--mon-w) * 0.68)); }
.art-li::before { content: '  > '; color: #005500; }
.art-oli { color: #009922; padding-left: 20px; margin-bottom: 2px; max-width: min(760px, calc(var(--mon-w) * 0.68)); }
.art-oli::before { content: attr(data-n) '.  '; color: #005500; }
.art-blockquote { color: #006622; border-left: 2px solid #004400; padding-left: 16px; margin: 6px 0; max-width: min(760px, calc(var(--mon-w) * 0.68)); }
.art-code-block {
  color: #00dd99; background: rgba(0,255,65,0.03);
  border-left: 2px solid #005500;
  padding: 8px 16px; margin: 10px 0;
  white-space: pre-wrap; word-break: break-all; font-size: 0.86em;
}
.art-hr     { border: none; border-top: 1px solid #003300; margin: 14px 0; }
.art-blank  { height: 6px; }
.art-loading { color: #005500; letter-spacing: 2px; margin-top: 20px; animation: pulse 1s ease infinite; }
.art-error   { color: #884400; margin-top: 20px; }

/* ── CONTACT LIST ── */
.ct-row {
  display: flex; align-items: baseline; gap: 16px;
  padding: clamp(3px, calc(var(--mon-w) * 0.004), 5px) clamp(3px, calc(var(--mon-w) * 0.005), 6px); font-size: 1em;
  border-left: 2px solid transparent; cursor: pointer; user-select: none;
}
.ct-row.active { background: #00ff41; color: #000a00; }
.ct-arrow { width: 16px; color: #00ff41; flex-shrink: 0; font-size: 0.62em; }
.ct-row.active .ct-arrow { color: #000a00; }
.ct-label { color: #00cc33; min-width: clamp(70px, calc(var(--mon-w) * 0.09), 110px); }
.ct-row.active .ct-label { color: #000a00; }
.ct-value { color: #006622; }
.ct-row.active .ct-value { color: #004400; }

/* ── CMD INPUT ── */
#cmd-input-indicator {
  display: inline-block;
  color: #00ff41;
}

/* ── OUTPUT / NEOFETCH ── */
.out-line  { font-size: 0.9em; color: #00bb33; margin-bottom: 2px; }
.out-key   { color: #00ff41; display: inline-block; min-width: 120px; }
.out-val   { color: #00aa22; }
.out-sep   { color: #004400; margin-bottom: 8px; }

function showStatic(duration, cb) {
  const staticEl = document.getElementById('crt-static');
  staticEl.style.display  = 'block';
  staticEl.style.opacity  = '1';
  staticEl.style.transition = '';

  const W = 320, H = 240;
  const sc = document.createElement('canvas');
  sc.width = W; sc.height = H;
  sc.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;';
  staticEl.appendChild(sc);
  const sCtx = sc.getContext('2d');

  let raf;
  function frame() {
    const img = sCtx.createImageData(W, H);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() > 0.55 ? Math.floor(Math.random() * 110) : 0;
      img.data[i]   = 0;
      img.data[i+1] = v;
      img.data[i+2] = Math.floor(v * 0.25);
      img.data[i+3] = 255;
    }
    sCtx.putImageData(img, 0, 0);
    raf = requestAnimationFrame(frame);
  }
  frame();

  setTimeout(() => {
    cancelAnimationFrame(raf);
    staticEl.style.transition = 'opacity 0.45s ease-out';
    staticEl.style.opacity = '0';
    setTimeout(() => {
      staticEl.style.display = 'none';
      staticEl.style.opacity = '1';
      staticEl.style.transition = '';
      staticEl.innerHTML = '';
      cb();
    }, 450);
  }, duration);
}

function runCRTPowerOn(cb) {
  const top      = document.getElementById('crt-top');
  const bottom   = document.getElementById('crt-bottom');
  const scanline = document.getElementById('crt-scanline');
  const flash    = document.getElementById('crt-flash');

  // Phase 0: phosphor excitation flash
  flash.style.transition = 'none';
  flash.style.opacity    = '0.28';
  setTimeout(() => {
    flash.style.transition = 'opacity 0.5s ease-out';
    flash.style.opacity    = '0';
  }, 90);

  // Phase 1: open curtains
  setTimeout(() => {
    top.style.height    = '0%';
    bottom.style.height = '0%';

    // curtains done — fade scanline
    setTimeout(() => {
      scanline.style.opacity = '0';

      setTimeout(() => {
        document.getElementById('crt-poweron').style.display = 'none';

        // Phase 2: green static / tuning noise
        showStatic(750, () => {
          // Phase 3: boot
          cb();
        });
      }, 500);
    }, 1100);
  }, 350);
}

// ── MARKDOWN → TERMINAL ──
function renderMarkdown(md, el) {
  const lines = md.split('\n');
  let inCode = false, codeBuf = [], olCount = 0;
  function flushCode() {
    if (!codeBuf.length) return;
    const d = mk('div', 'art-code-block'); d.textContent = codeBuf.join('\n'); el.appendChild(d);
    codeBuf = [];
  }
  function inline(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<span style="color:#00ff41">$1</span>')
      .replace(/\*(.+?)\*/g,     '<span style="color:#00cc44">$1</span>')
      .replace(/`([^`]+)`/g,     '<span style="color:#00ddaa;background:rgba(0,255,65,0.06);padding:0 3px">$1</span>');
  }
  lines.forEach(raw => {
    const line = raw.trimEnd();
    if (line.startsWith('```')) { if (inCode) { flushCode(); inCode = false; } else { inCode = true; } return; }
    if (inCode) { codeBuf.push(line); return; }
    if (!line.trim()) { el.appendChild(mk('div', 'art-blank')); olCount = 0; return; }
    if (/^---+$/.test(line)) { el.appendChild(mk('hr', 'art-hr')); return; }
    if (line.startsWith('# '))   { const d = mk('div','art-h1'); d.innerHTML = inline(line.slice(2));  el.appendChild(d); return; }
    if (line.startsWith('## '))  { const d = mk('div','art-h2'); d.innerHTML = inline(line.slice(3));  el.appendChild(d); return; }
    if (line.startsWith('### ')) { const d = mk('div','art-h3'); d.innerHTML = inline(line.slice(4));  el.appendChild(d); return; }
    if (line.startsWith('> '))   { const d = mk('div','art-blockquote'); d.innerHTML = inline(line.slice(2)); el.appendChild(d); return; }
    if (/^[-*] /.test(line))     { const d = mk('div','art-li'); d.innerHTML = inline(line.slice(2));  el.appendChild(d); return; }
    if (/^\d+\. /.test(line)) {
      olCount++;
      const d = mk('div','art-oli'); d.setAttribute('data-n', olCount); d.innerHTML = inline(line.replace(/^\d+\. /,'')); el.appendChild(d); return;
    }
    const d = mk('div','art-p'); d.innerHTML = inline(line); el.appendChild(d);
  });
  flushCode();
  const hint = mk('div', 'scroll-hint'); hint.textContent = '↑↓ scroll  ·  Esc back  ·  q quit'; el.appendChild(hint);
}

function mk(tag, cls) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  return el;
}

function executeCmd(raw) {
  const cmd = raw.trim();
  if (!cmd) { renderListing(); typePrompt('ls'); return; }
  const parts = cmd.split(/\s+/);
  const verb  = parts[0].toLowerCase();
  const arg   = parts.slice(1).join(' ');

  switch (verb) {
    case 'ls':
      renderListing();
      typePrompt('ls');
      break;

    case 'clear':
      renderListing();
      typePrompt('ls');
      break;

    case 'pwd':
      typePrompt(cmd);
      showOutput(['/home/juliomauro' + (document.getElementById('prompt-path').textContent.replace('~',''))]);
      break;

    case 'cat': {
      const catItem = MENU.find(m => m.name === arg || m.name === arg + '.txt' || m.id === arg);
      if (catItem) { openItem(catItem); }
      else { typePrompt(cmd); showOutput([`<span class="out-error">cat: ${arg}: No such file or directory</span>`]); }
      break;
    }

    case 'cd':
      if (!arg || arg === '~' || arg === '..') { goBack(); }
      else {
        const cdItem = MENU.find(m => m.id === arg || m.name === arg || m.name === arg + '/');
        if (cdItem) { openItem(cdItem); }
        else { typePrompt(cmd); showOutput([`<span class="out-error">cd: ${arg}: No such directory</span>`]); }
      }
      break;

    case 'whoami':
      typePrompt(cmd);
      showOutput([
        'juliomauro',
        '<span class="out-sep">──────────────────────────────────────────</span>',
        'Security engineer. Infrastructure architect. Open-source builder.',
        '25 years of ops. Zero tolerance for obscurity theater.',
        'Current mission: reduce attack surface, automate the boring stuff.',
      ]);
      break;

    case 'sudo':
      typePrompt(cmd + ' ' + (arg || '!!'));
      showOutput([
        `[sudo] password for juliomauro: `,
        '<span class="out-error">Permission denied — nice try.</span>',
        '<span style="color:#555">This incident will be reported.</span>',
      ]);
      break;

    case 'amber':
      typePrompt(cmd);
      setTerminalColor('amber');
      showOutput(['<span style="color:#ffb000">Phosphor color: AMBER</span>']);
      break;

    case 'green':
      typePrompt(cmd);
      setTerminalColor('green');
      showOutput(['<span style="color:#00ff41">Phosphor color: GREEN</span>']);
      break;

    case 'doom.exe':
      typePrompt(cmd);
      showDoom();
      break;

    case 'duke3d':
    case 'duke.exe':
      typePrompt(cmd);
      showOutput([
        '<span style="color:#cc8800">Hail to the king, baby.</span>',
        '<span style="color:#996600">Loading Duke Nukem 3D...</span>',
      ]);
      setTimeout(() => launchGame(
        'DUKE NUKEM 3D  ·  js-dos',
        'https://js-dos.com/cdn/upload/Duke%20Nukem%203d-%40digitalwalt.zip',
        ['CD DUKE3D', 'DUKE3D.EXE']
      ), 1200);
      break;

    case 'neo':
      typePrompt(cmd);
      showNeoEffect();
      break;

    case 'help':
      typePrompt(cmd);
      showOutput([
        '<span class="out-key">ls              </span><span class="out-val">list directory contents</span>',
        '<span class="out-key">cat &lt;file&gt;      </span><span class="out-val">read a file (e.g. cat summary.txt)</span>',
        '<span class="out-key">cd &lt;dir&gt;        </span><span class="out-val">enter a directory (e.g. cd experience)</span>',
        '<span class="out-key">cd ..           </span><span class="out-val">go back to listing</span>',
        '<span class="out-key">clear           </span><span class="out-val">clear screen and return to listing</span>',
        '<span class="out-key">pwd             </span><span class="out-val">print working directory</span>',
        '<span class="out-key">whoami          </span><span class="out-val">who is this?</span>',
        '<span class="out-key">amber / green   </span><span class="out-val">change phosphor color</span>',
        '<span class="out-key">exit            </span><span class="out-val">return to main site</span>',
        '',
        '<span class="out-sep">Navigation: ↑↓ move  ·  Enter open  ·  Esc back  ·  q quit</span>',
        '<span class="out-sep">Tip: start typing any command from the listing screen</span>',
      ]);
      break;

    case 'exit':
      doExit();
      break;

    default:
      typePrompt(cmd);
      showOutput([`<span class="out-error">${verb}: command not found — type 'help' for available commands</span>`]);
  }
}

const JSDOS_WASM = 'https://cdn.jsdelivr.net/npm/js-dos@6.22.60/dist/wdosbox-nosync.js';

function launchGame(title, bundleUrl, exe) {
  const overlay   = document.getElementById('game-overlay');
  const titleEl   = document.getElementById('game-title');
  const container = document.getElementById('dos-canvas');

  titleEl.textContent = title;
  container.innerHTML = '';
  overlay.style.display = 'flex';

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'width:100%;height:100%;display:block;image-rendering:pixelated;';
  container.appendChild(canvas);
  container.focus();

  function showErr(msg) {
    container.innerHTML =
      `<div style="color:#ff4400;padding:24px;font-size:14px;text-align:center;line-height:2">${msg}</div>`;
  }

  function boot() {
    try {
      canvas.width  = container.clientWidth  || 640;
      canvas.height = container.clientHeight || 400;

      dosCI = Dos(canvas, { wdosboxUrl: JSDOS_WASM })
        .ready((fs, main) => {
          fs.extract(bundleUrl)
            .then(() => {
              const cmds = Array.isArray(exe)
                ? exe.flatMap(c => ['-c', c])
                : ['-c', exe.replace(/^\//, '')];
              main(cmds);
            })
            .catch(err => showErr('Bundle load failed:<br>' + err));
        });
    } catch(err) {
      showErr('Emulator error:<br>' + (err.message || err));
    }
  }

  if (window.Dos) {
    boot();
  } else {
    const s = document.createElement('script');
    s.src = JSDOS_JS;
    s.onload  = boot;
    s.onerror = () => showErr('Could not load js-dos 6.22 from CDN.');
    document.head.appendChild(s);
  }
}

function closeGame() {
  const overlay   = document.getElementById('game-overlay');
  const container = document.getElementById('dos-canvas');
  overlay.style.display = 'none';
  container.innerHTML = '';
  if (dosCI && dosCI.exit) dosCI.exit();
  dosCI = null;
}

// Esc closes game overlay (capture phase to intercept before the game sees it)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('game-overlay').style.display !== 'none') {
    e.stopPropagation();
    closeGame();
  }
}, true);

// ── NEO MATRIX ──
function showNeoEffect() {
  const GLYPHS = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ01';
  const TARGET  = 'The Matrix has you';

  const overlay = document.getElementById('neo-overlay');
  const canvas  = document.getElementById('neo-canvas');
  const textEl  = document.getElementById('neo-text');

  overlay.style.display = 'flex';
  const W = overlay.offsetWidth || 800;
  const H = overlay.offsetHeight || 450;
  canvas.width  = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const cols  = Math.floor(W / 18);
  const drops = Array.from({length: cols}, () => Math.random() * -50 | 0);

  function drawRain() {
    ctx.fillStyle = 'rgba(0,3,0,0.06)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00ff41';
    ctx.font = '14px monospace';
    drops.forEach((y, i) => {
      ctx.fillText(GLYPHS[Math.random() * GLYPHS.length | 0], i * 18, y * 18);
      drops[i] = (y > H / 18 + Math.random() * 10) ? 0 : y + 1;
    });
  }

  const len     = TARGET.length;
  const locked  = new Array(len).fill(false);
  const display = new Array(len).fill(' ');
  let lockIdx = 0;

  function rnd() { return GLYPHS[Math.random() * GLYPHS.length | 0]; }
  function render() {
    textEl.innerHTML = display.map((ch, i) =>
      locked[i] ? ch : (TARGET[i] === ' ' ? ' ' : `<span style="color:#00cc33">${rnd()}</span>`)
    ).join('') + '<span style="border-right:2px solid #00ff41">_</span>';
  }

  const scrambleTimer = setInterval(render, 50);

  const snd = new Audio('../sound/matrix-theme.mp3');
  snd.volume = 0.82;
  snd.play().catch(() => {});

  setTimeout(() => {
    const lockTimer = setInterval(() => {
      if (lockIdx >= len) { clearInterval(lockTimer); return; }
      locked[lockIdx] = true; display[lockIdx] = TARGET[lockIdx]; lockIdx++;
    }, 75);

    const rainTimer = setInterval(drawRain, 40);
    let exiting = false;

    function doExitNeo() {
      if (exiting) return;
      exiting = true;
      document.removeEventListener('keydown', neoEscListener);
      snd.pause(); snd.currentTime = 0;
      let uIdx = len - 1;
      const unlockTimer = setInterval(() => {
        if (uIdx < 0) {
          clearInterval(unlockTimer); clearInterval(scrambleTimer); clearInterval(rainTimer);
          overlay.style.transition = 'opacity 0.5s';
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.style.display = 'none';
            overlay.style.opacity = ''; overlay.style.transition = '';
            textEl.innerHTML = '';
          }, 500);
          return;
        }
        locked[uIdx] = false; display[uIdx] = ' '; uIdx--;
      }, 55);
      const exitScramble = setInterval(() => { if (!exiting || overlay.style.display === 'none') { clearInterval(exitScramble); return; } render(); }, 50);
    }

    function neoEscListener(e) { if (e.key === 'Escape') doExitNeo(); }
    document.addEventListener('keydown', neoEscListener);

    const holdCheck = setInterval(() => {
      if (lockIdx < len) return;
      clearInterval(holdCheck); clearInterval(scrambleTimer); render();
      setTimeout(doExitNeo, 5000);
    }, 100);
  }, 400);
}

// ── KEYBOARD ──
function startCmdInput(firstChar) {
  mode = 'cmd-input';
  cmdBuffer = firstChar;
  updateCmdDisplay();
}

document.addEventListener('keydown', e => {
  // ── CMD INPUT ──
  if (mode === 'cmd-input') {
    if (e.key === 'Enter') {
      const raw = cmdBuffer;
      cmdBuffer = '';
      document.getElementById('prompt-cmd').textContent = '';
      executeCmd(raw);
    } else if (e.key === 'Escape') {
      cmdBuffer = '';
      document.getElementById('prompt-cmd').textContent = '';
      mode = 'listing';
      renderListing();
      typePrompt('ls');
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      cmdBuffer = cmdBuffer.slice(0, -1);
      updateCmdDisplay();
    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      cmdBuffer += e.key;
      updateCmdDisplay();
    }
    return;
  }

  // ── LISTING ──
  if (mode === 'listing') {
    if      (e.key === 'ArrowUp')             { e.preventDefault(); cursor = (cursor - 1 + MENU.length) % MENU.length; refreshCursor(); }
    else if (e.key === 'ArrowDown')           { e.preventDefault(); cursor = (cursor + 1) % MENU.length; refreshCursor(); }
    else if (e.key === 'Enter')               { openItem(MENU[cursor]); }
    else if (e.key === 'q' || e.key === 'Q') { doExit(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
    return;
  }

  // ── EXP LIST ──
  if (mode === 'exp-list') {
    const sv = document.getElementById('section-view');
    if      (e.key === 'ArrowUp')             { e.preventDefault(); experienceCursor = (experienceCursor - 1 + DATA.experience.length) % DATA.experience.length; refreshExperienceCursor(sv); }
    else if (e.key === 'ArrowDown')           { e.preventDefault(); experienceCursor = (experienceCursor + 1) % DATA.experience.length; refreshExperienceCursor(sv); }
    else if (e.key === 'Enter')               { openExperienceDetail(DATA.experience[experienceCursor]); }
    else if (e.key === 'Escape')              { goBack(); }
    else if (e.key === 'q' || e.key === 'Q') { doExit(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
    return;
  }

  // ── EXP DETAIL ──
  if (mode === 'exp-detail') {
    const ca = document.getElementById('content-area');
    if      (e.key === 'ArrowDown')           { e.preventDefault(); ca.scrollBy({ top:  45, behavior: 'smooth' }); }
    else if (e.key === 'ArrowUp')             { e.preventDefault(); ca.scrollBy({ top: -45, behavior: 'smooth' }); }
    else if (e.key === 'Escape')              { goBackToExperience(); }
    else if (e.key === 'q' || e.key === 'Q') { doExit(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
    return;
  }

  // ── PROJECTS LIST ──
  if (mode === 'projects-list') {
    const sv = document.getElementById('section-view');
    if      (e.key === 'ArrowUp')             { e.preventDefault(); projectsCursor = (projectsCursor - 1 + DATA.projects.length) % DATA.projects.length; refreshProjectsCursor(sv); }
    else if (e.key === 'ArrowDown')           { e.preventDefault(); projectsCursor = (projectsCursor + 1) % DATA.projects.length; refreshProjectsCursor(sv); }
    else if (e.key === 'Enter')               { openProject(DATA.projects[projectsCursor]); }
    else if (e.key === 'Escape')              { goBack(); }
    else if (e.key === 'q' || e.key === 'Q') { doExit(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
    return;
  }

  // ── PROJECT DETAIL ──
  if (mode === 'project-detail') {
    const ca = document.getElementById('content-area');
    if      (e.key === 'ArrowDown')           { e.preventDefault(); ca.scrollBy({ top:  45, behavior: 'smooth' }); }
    else if (e.key === 'ArrowUp')             { e.preventDefault(); ca.scrollBy({ top: -45, behavior: 'smooth' }); }
    else if (e.key === 'Enter')               { if (currentProject) openProjectUrl(currentProject); }
    else if (e.key === 'Escape')              { goBackToProjects(); }
    else if (e.key === 'q' || e.key === 'Q') { doExit(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
    return;
  }

  // ── CONTACT LIST ──
  if (mode === 'contact-list') {
    const sv = document.getElementById('section-view');
    if      (e.key === 'ArrowUp')             { e.preventDefault(); contactCursor = (contactCursor - 1 + DATA.contact.length) % DATA.contact.length; refreshContactCursor(sv); }
    else if (e.key === 'ArrowDown')           { e.preventDefault(); contactCursor = (contactCursor + 1) % DATA.contact.length; refreshContactCursor(sv); }
    else if (e.key === 'Enter')               { openContactLink(DATA.contact[contactCursor]); }
    else if (e.key === 'Escape')              { goBack(); }
    else if (e.key === 'q' || e.key === 'Q') { doExit(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
    return;
  }

  // ── WRITING LIST ──
  if (mode === 'writing-list') {
    const sv = document.getElementById('section-view');
    if      (e.key === 'ArrowUp')             { e.preventDefault(); writingCursor = (writingCursor - 1 + DATA.writing.length) % DATA.writing.length; refreshWritingCursor(sv); }
    else if (e.key === 'ArrowDown')           { e.preventDefault(); writingCursor = (writingCursor + 1) % DATA.writing.length; refreshWritingCursor(sv); }
    else if (e.key === 'Enter')               { openArticle(DATA.writing[writingCursor]); }
    else if (e.key === 'Escape')              { goBack(); }
    else if (e.key === 'q' || e.key === 'Q') { doExit(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
    return;
  }

  // ── ARTICLE / SECTION / OUTPUT (scrollable) ──
  const ca = document.getElementById('content-area');
  if      (e.key === 'ArrowDown')             { e.preventDefault(); ca.scrollBy({ top:  45, behavior: 'smooth' }); }
  else if (e.key === 'ArrowUp')               { e.preventDefault(); ca.scrollBy({ top: -45, behavior: 'smooth' }); }
  else if (e.key === 'Escape')                {
    if      (mode === 'article')              { goBackToWriting(); }
    else if (mode === 'exp-detail')           { goBackToExperience(); }
    else if (mode === 'project-detail')       { goBackToProjects(); }
    else                                      { goBack(); }
  }
  else if (e.key === 'q' || e.key === 'Q')   { doExit(); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { startCmdInput(e.key); }
});

// ── EXPERIENCE LIST ──
function renderExperienceList(el) {
  el.innerHTML = '';
  const head = mk('div', 'sv-head'); head.textContent = 'experience/'; el.appendChild(head);
  DATA.experience.forEach((job, i) => {
    const period = job.meta.split('·').pop().trim();
    const row = mk('div', 'exp-row' + (i === experienceCursor ? ' active' : ''));
    row.innerHTML =
      `<span class="exp-arrow">${i === experienceCursor ? '▶' : ' '}</span>` +
      `<span class="exp-company">${job.company}</span>` +
      `<span class="exp-period">${period}</span>`;
    row.addEventListener('click', () => { experienceCursor = i; refreshExperienceCursor(el); openExperienceDetail(DATA.experience[experienceCursor]); });
    el.appendChild(row);
  });
  const hint = mk('div', 'scroll-hint'); hint.textContent = '↑↓ move  ·  Enter open  ·  Esc back'; el.appendChild(hint);
}

function refreshExperienceCursor(el) {
  el.querySelectorAll('.exp-row').forEach((row, i) => {
    const on = i === experienceCursor;
    row.classList.toggle('active', on);
    row.querySelector('.exp-arrow').textContent = on ? '▶' : ' ';
    if (on) row.scrollIntoView({ block: 'nearest' });
  });
}

function openExperienceDetail(job) {
  mode = 'exp-detail';
  typePrompt('cat ' + job.company.toLowerCase().replace(/\s+/g, '-') + '.txt');
  setPath('~/experience/' + job.company.toLowerCase().replace(/\s+/g, '-'));
  const sv = document.getElementById('section-view');
  sv.innerHTML = '';
  document.getElementById('content-area').scrollTop = 0;
  const c = mk('div', 'sv-company'); c.textContent = job.company; sv.appendChild(c);
  const m = mk('div', 'sv-meta');    m.textContent = job.meta;    sv.appendChild(m);
  sv.appendChild(mk('hr', 'sv-divider'));
  job.roles.forEach(role => {
    const r = mk('div', 'sv-role'); r.textContent = '[' + role.title + ']'; sv.appendChild(r);
    role.bullets.forEach(b => { const d = mk('div', 'sv-bullet'); d.textContent = b; sv.appendChild(d); });
    sv.appendChild(mk('div', 'sv-blank'));
  });
  const hint = mk('div', 'scroll-hint'); hint.textContent = '↑↓ scroll  ·  Esc back  ·  q quit'; sv.appendChild(hint);
}

function goBackToExperience() {
  mode = 'exp-list';
  setPath('~/experience');
  const sv = document.getElementById('section-view');
  sv.innerHTML = '';
  renderExperienceList(sv);
  document.getElementById('content-area').scrollTop = 0;
  typePrompt('ls experience/');
}

// ── PROJECTS LIST ──
const STATUS_LABEL = { wip: 'WIP', active: 'ACTIVE', done: 'DONE', growing: 'GROWING' };
const STATUS_COLOR = { wip: '#ffaa00', active: '#00ff41', done: '#00aa22', growing: '#00ccff' };

function renderProjectsList(el) {
  el.innerHTML = '';
  const head = mk('div', 'sv-head'); head.textContent = 'projects/'; el.appendChild(head);
  DATA.projects.forEach((p, i) => {
    const row = mk('div', 'pr-row' + (i === projectsCursor ? ' active' : ''));
    const badge = `<span class="pr-badge status-${p.status}" style="color:${STATUS_COLOR[p.status]};border-color:${STATUS_COLOR[p.status]}44">${STATUS_LABEL[p.status]}</span>`;
    row.innerHTML =
      `<span class="pr-arrow">${i === projectsCursor ? '▶' : ' '}</span>` +
      `<span class="pr-num">${p.num}</span>` +
      `<span class="pr-title">${p.title}</span>` +
      badge;
    row.addEventListener('click', () => { projectsCursor = i; refreshProjectsCursor(el); openProject(DATA.projects[projectsCursor]); });
    el.appendChild(row);
  });
  const hint = mk('div', 'scroll-hint'); hint.textContent = '↑↓ move  ·  Enter open link  ·  Esc back'; el.appendChild(hint);
}

function refreshProjectsCursor(el) {
  el.querySelectorAll('.pr-row').forEach((row, i) => {
    const on = i === projectsCursor;
    row.classList.toggle('active', on);
    row.querySelector('.pr-arrow').textContent = on ? '▶' : ' ';
    if (on) row.scrollIntoView({ block: 'nearest' });
  });
}

function openProject(p) {
  currentProject = p;
  mode = 'project-detail';
  const slug = p.title.toLowerCase().replace(/\s+/g, '-');
  typePrompt('cat ' + slug + '.txt');
  setPath('~/projects/' + slug);
  const sv = document.getElementById('section-view');
  sv.innerHTML = '';
  document.getElementById('content-area').scrollTop = 0;
  renderProjectDetail(p, sv);
}

function renderProjectDetail(p, el) {
  const SLABEL = { wip:'WIP', active:'ACTIVE', done:'DONE', growing:'GROWING' };
  const SCOLOR = { wip:'#ffaa00', active:'#00ff41', done:'#00aa22', growing:'#00ccff' };

  const head = mk('div', 'sv-head');
  head.innerHTML = `${p.num} &nbsp;·&nbsp; ${p.year}&nbsp;<span style="color:${SCOLOR[p.status]};border:1px solid ${SCOLOR[p.status]}55;padding:1px 8px;font-size:13px;letter-spacing:2px">${SLABEL[p.status]}</span>`;
  el.appendChild(head);

  const title = mk('div', 'sv-company'); title.textContent = p.title; el.appendChild(title);
  const meta  = mk('div', 'sv-meta');   meta.textContent  = p.meta;  el.appendChild(meta);
  el.appendChild(mk('hr', 'sv-divider'));

  const desc = mk('div', 'sv-bullet'); desc.textContent = p.desc; el.appendChild(desc);
  el.appendChild(mk('div', 'sv-blank'));

  if (p.url) {
    const urlEl = mk('div', 'sv-proj-url');
    urlEl.textContent = p.url;
    urlEl.style.cursor = 'pointer';
    urlEl.addEventListener('click', () => openProjectUrl(p));
    el.appendChild(urlEl);
    el.appendChild(mk('div', 'sv-blank'));
    const hint = mk('div', 'scroll-hint');
    hint.textContent = 'Enter · open link   Esc · back   q · quit';
    el.appendChild(hint);
  } else {
    const hint = mk('div', 'scroll-hint');
    hint.textContent = 'Esc · back   q · quit';
    el.appendChild(hint);
  }
}

function openProjectUrl(p) {
  if (!p.url) return;
  const url = p.url.startsWith('http') ? p.url : 'https://' + p.url;
  typePrompt('open ' + url);
  window.open(url, '_blank');
}

function goBackToProjects() {
  mode = 'projects-list';
  setPath('~/projects');
  const sv = document.getElementById('section-view');
  sv.innerHTML = '';
  renderProjectsList(sv);
  document.getElementById('content-area').scrollTop = 0;
  typePrompt('ls projects/');
}

function goBack() {
  typePrompt('cd ..');
  renderListing();
  typePrompt('ls');
}

function goBackToWriting() {
  mode = 'writing-list';
  setPath('~/writing');
  const sv = document.getElementById('section-view');
  sv.innerHTML = '';
  renderWritingList(sv);
  document.getElementById('content-area').scrollTop = 0;
  typePrompt('ls writing/');
}

function doExit() {
  typePrompt('exit', () => setTimeout(() => window.location.href = '/', 500));
}

runCRTPowerOn(runBoot);
